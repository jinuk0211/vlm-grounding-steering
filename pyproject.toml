[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-grounding-steering"
version = "0.1.0"
description = "GPU-ready research implementation of evidence-preserving head steering and VLM baselines"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.8,<2.9",
  "transformers==4.57.1",
  "accelerate>=1.0,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
eval = ["nltk>=3.9,<4", "pycocotools>=2.0.8", "PatternLite==3.6", "tqdm>=4.66"]
test = ["pytest>=8,<9", "ruff==0.14.1"]

[project.scripts]
vlm-grounding = "vlm_grounding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlm_grounding = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
